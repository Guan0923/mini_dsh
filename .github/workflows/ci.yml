name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / check / test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          # package.json 的 engines 要求 node >= 24.12.0
          node-version: 24.x
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 代码规则
        run: npm run lint

      - name: 类型检查
        run: npm run check

      - name: 测试
        run: npm test
